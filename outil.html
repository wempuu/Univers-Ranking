<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modifier la liste · Univers Ranking</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <header class="wrap site">
    <a class="logo" href="./">Univers <span class="grad">Ranking</span></a>
    <nav>
      <a href="./">Accueil</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="jeux.html">Jeux</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero" style="padding:32px 0 16px">
      <h1>Modifier la liste</h1>
      <p>Noms des personnages, catégories et ordre. Les tags se modifient dans la fiche de chaque personnage.</p>
      <button type="button" class="edit-link link-btn" id="btn-close">✕ Fermer l'édition</button>
    </section>

    <div id="gh-panel"></div>

    <div class="tool-bar">
      <label for="manga" class="muted-small">Manga</label>
      <select id="manga"></select>
      <span class="muted-small" id="count"></span>
    </div>

    <form class="tool-bar" id="add-form">
      <input class="tool-input" id="add-name" placeholder="Nom du personnage à ajouter" autocomplete="off">
      <select id="add-group" aria-label="Catégorie"></select>
      <select id="add-where" aria-label="Où ajouter">
        <option value="end">en dernier</option>
        <option value="start">en premier</option>
      </select>
      <button class="btn" type="submit">➕ Ajouter</button>
    </form>

    <ul class="edit-list" id="list"></ul>
  </main>

  <script src="common.js?v=10"></script>
  <script src="github-panel.js?v=10"></script>
  <script src="outil.js?v=10"></script>
</body>
</html>
