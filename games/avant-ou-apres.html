<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avant ou après ? · Univers Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="logo" href="../">Univers <span>Ranking</span></a>
      <a class="back" href="../">← Tous les jeux</a>
    </header>

    <section class="hero" style="padding-bottom:8px">
      <h1>Avant ou après ?</h1>
      <p>La deuxième œuvre est-elle sortie <b>avant</b> ou <b>après</b> la première ?</p>
    </section>

    <div class="game-top">
      <div>Score : <b id="score">0</b></div>
      <div>Record : <b id="best">0</b></div>
    </div>

    <div class="duel">
      <div class="item" id="a"></div>
      <div class="vs">VS</div>
      <div class="item" id="b"></div>
    </div>

    <div class="message" id="msg"></div>

    <div class="center choices" id="choices" style="max-width:360px;margin:0 auto 64px">
      <button class="btn" id="btn-before">⬅️ Sortie avant</button>
      <button class="btn" id="btn-after">Sortie après ➡️</button>
      <button class="btn ghost" id="btn-next" hidden>Continuer</button>
      <button class="btn ghost" id="btn-restart" hidden>Rejouer</button>
    </div>
  </div>

  <script src="avant-ou-apres.js"></script>
</body>
</html>
