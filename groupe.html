<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groupe · Univers Ranking</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=34">
  <script src="anim.js?v=34"></script>
</head>
<body>
  <header class="wrap site">
    <a class="logo" href="./">Univers <span class="grad">Ranking</span></a>
    <nav>
      <a href="catalogue.html">Catalogue</a>
      <a href="jeux.html">Jeux</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero" style="padding:32px 0 8px">
      <h1>Groupe</h1>
      <p class="tool-status" id="status">Connexion…</p>
    </section>

    <div class="lobby" id="lobby" hidden>
      <section class="lobby-card">
        <p class="eyebrow">Code du groupe</p>
        <div class="group-code" id="code"></div>
        <div class="tool-bar" style="justify-content:center;margin:12px 0 0">
          <button class="btn" id="btn-copy" type="button">📋 Copier l'invitation</button>
        </div>
        <p class="muted-small" style="text-align:center;margin:8px 0 0">Envoie ce code à tes amis : ils le saisissent sur la page Jouer, ou ouvrent le lien copié.</p>
      </section>

      <section class="lobby-card">
        <h2 class="lobby-title">Joueurs <span class="muted-small" id="count"></span></h2>
        <ul class="players" id="players"></ul>
      </section>

      <section class="lobby-card play-card" id="play-card" hidden>
        <div class="secret" id="secret"></div>
        <div class="play-head">
          <h2 class="lobby-title" id="play-title"></h2>
          <span class="timer" id="timer"></span>
        </div>
        <p class="muted-small" id="play-info"></p>
        <ol class="chat" id="chat"></ol>
        <form class="tool-bar word-form" id="word-form" hidden>
          <input class="tool-input" id="word" maxlength="30" placeholder="Un seul mot pour décrire ton perso…" autocomplete="off" spellcheck="false">
          <button class="btn" type="submit">Envoyer</button>
        </form>
        <div class="vote" id="vote" hidden></div>
        <div class="result" id="result" hidden></div>
        <div class="tool-bar" id="host-actions" hidden>
          <button class="btn" id="btn-replay" type="button">🔁 Rejouer</button>
          <button class="btn ghost" id="btn-lobby" type="button">Retour au groupe</button>
        </div>
      </section>

      <section class="lobby-card" id="setup-card">
        <h2 class="lobby-title">Jeu</h2>
        <select class="tool-input" id="game"></select>
        <p class="muted-small" id="game-desc"></p>
        <div class="rules" id="rules"></div>
        <p class="muted-small" id="host-only"></p>
        <div class="tool-bar" style="margin:16px 0 0">
          <button class="btn" id="btn-start" type="button" disabled>▶ Lancer la partie</button>
          <button class="btn ghost" id="btn-leave" type="button">Quitter le groupe</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <a class="footer-logo" href="./">Univers <span class="grad">Ranking</span></a>
    <p class="footer-tag">Des mini-jeux pour les fans de pop culture</p>
    <nav class="footer-nav">
      <a href="./">Accueil</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="jeux.html">Jeux</a>
    </nav>
  </footer>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="common.js?v=34"></script>
  <script src="jeux-liste.js?v=34"></script>
  <script src="undercover.js?v=34"></script>
  <script src="groupe.js?v=34"></script>
</body>
</html>
